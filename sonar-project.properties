# ==================================================================
# SONARQUBE / SONARCLOUD YAPILANDIRMASI -- PDF Sprint 19
# ==================================================================
# ------------------------------------------------------------------
# DURUST NOT: BU YAPILANDIRMA HENUZ CALISTIRILMADI
# ------------------------------------------------------------------
# SonarQube bir SUNUCU gerektiriyor. Iki secenek var:
#
#   a) SonarCloud (bulut, acik kaynak projelere ucretsiz)
#      -> Bir hesap ve SONAR_TOKEN gizli anahtari gerekiyor
#
#   b) Kendi sunucunu calistirmak (docker: sonarqube:community)
#      -> ~2 GB RAM ve ayri bir kurulum
#
# Ikisi de bu projenin sinirlarinin disinda: elimde bir SonarCloud
# hesabi yok ve olmadan yazacagim her sey TAHMIN olurdu.
#
# Bu yuzden yaptigim sey: yapilandirmayi HAZIRLAMAK ve calistirmak
# icin gereken adimlari yazmak. "Calisiyor" demiyorum -- cunku
# calistirmadim.
#
# ------------------------------------------------------------------
# SONARQUBE OLMADAN NE KAYBEDIYORUZ, NE KAYBETMIYORUZ?
# ------------------------------------------------------------------
# KAYBETMIYORUZ (bunlar zaten var):
#   - Statik analiz        -> .NET Analyzers (CA) + StyleCop (SA),
#                             TreatWarningsAsErrors ile ZORUNLU
#   - Guvenlik taramasi    -> NuGet/npm acik taramasi + Trivy (CI)
#   - Test kapsami         -> coverlet + ReportGenerator (CI)
#   - Frontend lint        -> oxlint + Prettier
#
# KAYBEDIYORUZ:
#   - Kod tekrari (duplication) olcumu
#   - Karmasiklik (cyclomatic complexity) metrikleri
#   - "Teknik borc" tahmini ve zaman icindeki EGILIM grafikleri
#   - Quality Gate: "kapsam %X'in altina duserse PR'i engelle"
#
# Sonuncusu en degerlisi ve su an eksik olan tek gercek sey.
# ==================================================================

sonar.projectKey=ademucar_Bilet-Rezervasyon-Projesi
sonar.projectName=Biletim - Etkinlik ve Bilet Rezervasyon Sistemi
sonar.organization=ademucar

# ---- Kaynak ve test ayrimi ----
#
# Ayirmak SART: test kodu farkli kurallara tabi. Ayirmasaydik
# SonarQube test dosyalarindaki "kod tekrarini" (ki testlerde
# tekrar NORMALDIR) teknik borc sayardi.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*Tests.cs
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/dist/**

# ---- Analiz DISI birakilanlar ----
#
# Migrations: EF tarafindan URETILIYOR. Elle duzeltmek anlamsiz --
# bir sonraki migration uretiminde ayni bulgular geri gelir.
# (.editorconfig'te de ayni muafiyet var.)
#
# generated/: Orval'in urettigi TypeScript tipleri (Sprint 18).
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/*Setup.cs
sonar.cpd.exclusions=**/Migrations/**,**/src/lib/api/generated/**

# ---- Kapsam raporlari ----
#
# CI, coverlet ile Cobertura bicimi uretiyor; SonarQube onu
# dogrudan okuyabiliyor.
sonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=TestResults/**/*.trx
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# ==================================================================
# CALISTIRMAK ICIN
# ==================================================================
#   1. https://sonarcloud.io adresinde projeyi olustur
#   2. Uretilen token'i GitHub'da secret olarak ekle: SONAR_TOKEN
#   3. .github/workflows/ci.yml icine bir "sonar" isi ekle:
#
#        - uses: SonarSource/sonarcloud-github-action@master
#          env:
#            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#            SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
#
#   4. Quality Gate'i "required status check" olarak isaretle
#
# 4. adim, dal korumasindaki test zorunlulugunun kapsam ayagi olur:
# testler gecse bile kapsam duserse merge engellenir.
# ==================================================================
