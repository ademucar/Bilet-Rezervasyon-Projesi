# PDF Sprint 2: "Docker Compose ile asagidaki servisler ayaga kaldirilmalidir:
# PostgreSQL, Redis, Backend API, Frontend, pgAdmin, Redis Insight, Mailpit"
#
# Kullanim:
#   cd docker
#   cp .env.example .env      # ve icindeki sifreleri degistir
#   docker compose up -d
#
# Servisler ve portlari:
#   api            -> http://localhost:5000   (Swagger: /openapi/v1.json)
#   postgres       -> localhost:5432
#   redis          -> localhost:6379
#   pgAdmin        -> http://localhost:5050
#   Redis Insight  -> http://localhost:5540
#   Mailpit        -> http://localhost:8025
#
# Not: Frontend servisi Sprint 3'te React projesi olusturulunca eklenecek.

name: ticketing

services:
  # ---------------------------------------------------------------
  # PostgreSQL -- ana veritabani
  # ---------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Turkce karakterlerin dogru siralanmasi ve karsilastirilmasi icin.
      # Varsayilan "C" locale'inde 'ç' harfi 'z'den sonra siralanir ve
      # etkinlik listesi alfabetik sirada yanlis gorunur.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      # ------------------------------------------------------------
      # HOST PORTU 5433, container ici 5432.
      # ------------------------------------------------------------
      # Bu makinede 5432 portu ZATEN DOLU: hem baska bir projenin
      # container'i hem de kurulu PostgreSQL 17 servisi orayi kullaniyor.
      #
      # Onlari durdurmak yerine kendi host portumuzu degistiriyoruz --
      # baska projeleri bozmamak icin. Container ICINDEKI port hala
      # 5432; api servisi ic agdan "postgres:5432" ile baglaniyor ve
      # bu degisiklikten etkilenmiyor.
      #
      # Uretimde bu satir tamamen KALDIRILIR; veritabanina yalnizca
      # ic agdan erisilir, disariya port acilmaz.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # ------------------------------------------------------------
      # NEDEN HEALTHCHECK SART?
      # ------------------------------------------------------------
      # Container'in "calisiyor" olmasi, PostgreSQL'in BAGLANTI KABUL
      # ETTIGI anlamina gelmez. Ilk acilista veritabani dosyalarini
      # olusturmasi birkac saniye surer.
      #
      # Healthcheck olmadan API container'i hemen baslar, baglanti
      # kuramaz ve cokerdi. "depends_on: condition: service_healthy"
      # ile birlikte bu sorunu tamamen ortadan kaldiriyoruz.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ticketing-network

  # ---------------------------------------------------------------
  # Redis -- cache, dagitik kilit, rate limiting
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    restart: unless-stopped
    # --appendonly yes  -> kalicilik (AOF). Redis yeniden baslatildiginda
    #                      veriler kaybolmaz.
    #
    # Bizim icin bu SART DEGIL ama iyi bir aliskanlik: Redis'i yalnizca
    # cache icin kullaniyoruz, dogruluk kaynagi PostgreSQL. Yine de
    # gelistirme sirasinda Redis'in her restart'ta bosalmasi kafa
    # karistirici hata ayiklama seanslarina yol acar.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      # Redis icin de ayni onlem.
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ticketing-network

  # ---------------------------------------------------------------
  # pgAdmin -- veritabani yonetim arayuzu
  # ---------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ticketing-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      # Yerel gelistirmede her acilista giris yapmayi zorunlu kilmiyoruz.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticketing-network

  # ---------------------------------------------------------------
  # Redis Insight -- Redis gorsel arayuzu
  # ---------------------------------------------------------------
  redis-insight:
    image: redis/redisinsight:latest
    container_name: ticketing-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ticketing-network

  # ---------------------------------------------------------------
  # Mailpit -- yerel e-posta test sunucusu
  # ---------------------------------------------------------------
  #
  # PDF Sprint 2: "Mailpit veya benzeri yerel e-posta test servisi"
  #
  # Ne ise yarar? Uygulama e-posta gonderdiginde Mailpit onu YAKALAR ve
  # web arayuzunde gosterir -- gercekten kimseye gondermez.
  #
  # Bu KRITIK bir guvenlik onlemi: gelistirme sirasinda test verisindeki
  # gercek bir e-posta adresine yanlislikla "biletiniz hazir" maili
  # gitmesini engeller. Gercek bir SMTP sunucusu kullansaydik boyle
  # kazalar kacinilmaz olurdu.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketing-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web arayuzu -> http://localhost:8025
      - "1025:1025"   # SMTP -> uygulama buraya baglanir
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - ticketing-network

  # ---------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------
  api:
    build:
      # Build baglami backend/ klasoru; Dockerfile oradaki yollara gore yazildi.
      context: ../backend
      dockerfile: Dockerfile
    container_name: ticketing-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Cift alt cizgi (__) .NET'te ic ice yapilandirmayi temsil eder:
      # ConnectionStrings__Postgres  ->  ConnectionStrings:Postgres
      #
      # Servis adlarini (postgres, redis) host olarak kullaniyorum;
      # Docker'in ic DNS'i bunlari cozer. "localhost" yazsaydik
      # container KENDI icine baglanmaya calisirdi.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__From: ${SMTP_FROM}
    ports:
      - "5000:8080"
    volumes:
      # Yuklenen dosyalar container silinince kaybolmasin.
      - api-uploads:/app/uploads
    depends_on:
      # service_healthy KRITIK: sadece "depends_on: postgres" deseydik
      # Docker container'in BASLADIGINI bekler, HAZIR oldugunu degil.
      # API, PostgreSQL henuz baglanti kabul etmeden ayaga kalkar ve coker.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - ticketing-network

  # ==================================================================
  # FRONTEND -- PDF Sprint 2 compose servisi
  # ==================================================================
  # Sprint 19 denetiminde bu servisin EKSIK oldugunu buldum.
  # PDF iki yerde istiyor:
  #   Sprint 2  -> compose servisleri arasinda "Frontend"
  #   Zorunlu   -> "Tum proje Docker Compose ile ayaga
  #                 kaldirilabilmelidir."
  #
  # Yoktu; arayuzu calistirmak icin ayrica `npm run dev` gerekiyordu.
  # ==================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # nginx ayni kaynaktan API'ye vekillik ediyor; tarayici
        # acisindan CORS devreye girmiyor.
        VITE_API_URL: /api
    container_name: ticketing-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      # service_started YETERLI, service_healthy DEGIL.
      #
      # Frontend statik dosya sunuyor; API hazir olmasa bile sayfa
      # aciliyor ve kullanici "sunucuya ulasilamiyor" hatasi
      # goruyor. service_healthy beklemek, API cokmusse arayuzun
      # HIC acilmamasina yol acardi -- oysa o an kullaniciya
      # anlamli bir hata gostermek istiyoruz.
      api:
        condition: service_started
    networks:
      - ticketing-network


volumes:
  postgres-data:
  api-uploads:
  redis-data:
  pgadmin-data:
  redis-insight-data:

networks:
  ticketing-network:
    driver: bridge
