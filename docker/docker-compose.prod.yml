# ==================================================================
# YAYIN (PRODUCTION) YIGINI -- TEK SUNUCU
# ==================================================================
# Kullanim:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# ------------------------------------------------------------------
# NEDEN AYRI DOSYA? Neden docker-compose.yml'in "overlay"i degil?
# ------------------------------------------------------------------
# Ilk denedigim yol overlay'di (-f base -f prod). Calismiyor:
# Compose'da `ports` listeleri BIRLESTIRILIYOR, degistirilmiyor.
# Yani base'deki "5433:5432" satirini overlay ile KALDIRAMIYORUM --
# PostgreSQL internete acik kalirdi.
#
# Yayin ortaminda en kritik sey hangi portun disariya acik OLMADIGI
# oldugu icin, bunu overlay'in birlestirme kurallarina emanet
# etmiyorum. Bu dosya kendi kendine yeterli.
#
# ------------------------------------------------------------------
# DISARIYA ACIK TEK SEY: CADDY (80/443)
# ------------------------------------------------------------------
# postgres, redis, api ve frontend'in `ports` girdisi YOK. Yalnizca
# ic agdan erisilebiliyorlar. Gelistirme dosyasindaki
# pgadmin / redis-insight / mailpit ise buraya HIC alinmadi:
#
#   - mailpit  : gercek e-posta gondermiyor, yutuyor. Yayinda
#                kullanilirsa hicbir kullanici sifre sifirlama
#                postasini alamaz.
#   - pgadmin  : internete acik bir veritabani yoneticisi, tek bir
#                zayif parolayla tum verinin kaybi demek.
#   - insight  : ayni gerekce.
#
# Bunlara yayinda ihtiyac olursa dogru yol SSH tuneli:
#   ssh -L 5433:localhost:5433 kullanici@sunucu
# ==================================================================

name: ticketing-prod

services:
  # ================================================================
  # POSTGRESQL
  # ================================================================
  postgres:
    image: postgres:17-alpine
    container_name: ticketing-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Turkce siralama ve buyuk/kucuk harf icin. Yerelde de ayni.
      LANG: tr_TR.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Yedekler ana makinede: container silinse de duruyorlar.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ticketing-network

  # ================================================================
  # REDIS
  # ================================================================
  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    restart: always
    # --requirepass: parolasiz Redis, aci ag icinde bile kabul
    # edilemez. Bir container ele gecirilirse oturum onbellegine
    # ve hiz sinirlayici sayaclarina dogrudan erisim demek.
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketing-network

  # ================================================================
  # API
  # ================================================================
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ticketing-api
    restart: always
    environment:
      # Development DEGIL: Scalar arayuzu, ayrintili hata sayfalari
      # ve gevsetilmis kurallar yayinda kapali olmali.
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"

      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}

      # GERCEK SMTP. mailpit yok: yayinda e-postanin gercekten
      # gitmesi gerekiyor (e-posta onayi, sifre sifirlama).
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__From: ${SMTP_FROM}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__UseSsl: ${SMTP_USE_SSL}

      # E-postalardaki baglantilar bunlarla uretiliyor. Kullanicinin
      # TARAYICISINDAN acilacaklari icin servis adi degil, gercek
      # alan adi yaziliyor.
      AppUrls__Frontend: https://${SITE_DOMAIN}
      AppUrls__Api: https://${SITE_DOMAIN}/api
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticketing-network

  # ================================================================
  # FRONTEND (nginx)
  # ================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: ticketing-frontend
    restart: always
    depends_on:
      api:
        condition: service_started
    networks:
      - ticketing-network

  # ================================================================
  # CADDY -- TLS ve tek giris noktasi
  # ================================================================
  caddy:
    image: caddy:2-alpine
    container_name: ticketing-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikalar KALICI olmali. Bu birim olmadan her yeniden
      # baslatmada yeni sertifika istenir ve Let's Encrypt'in
      # haftalik kotasina takilip site sertifikasiz kalir.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    networks:
      - ticketing-network

volumes:
  postgres-data:
  redis-data:
  api-uploads:
  caddy-data:
  caddy-config:

networks:
  ticketing-network:
    driver: bridge
