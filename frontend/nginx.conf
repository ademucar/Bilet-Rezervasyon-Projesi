# ==================================================================
# NGINX -- statik dosya sunumu + API vekilligi
# PDF Sprint 2: Docker Compose'da Frontend servisi
# ==================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==============================================================
    # SPA YONLENDIRMESI -- try_files
    # ==============================================================
    # React Router adresleri ISTEMCIDE cozuyor. Kullanici
    # /biletlerim adresini dogrudan actiginda (veya sayfayi
    # yeniledikte) nginx diskte "biletlerim" diye bir dosya ariyor,
    # bulamiyor ve 404 donuyor.
    #
    # try_files ile: once gercek dosyayi ara, yoksa index.html'i
    # dondur. React uygulamasi aciliyor ve adresi kendisi cozuyor.
    #
    # Bu satir olmadan uygulama YALNIZCA ana sayfadan gezinildiginde
    # calisir; her yenileme 404 verir. Docker'a alinan SPA'larda en
    # sik yapilan hata budur.
    # ==============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==============================================================
    # API VEKILLIGI
    # ==============================================================
    # Tarayici acisindan istek AYNI kaynaga (frontend:80) gidiyor;
    # nginx arka planda API'ye iletiyor. CORS hic devreye girmiyor.
    #
    # Gelistirmedeki Vite proxy'siyle ayni yapi -- bilincli:
    # iki ortam ayni sekilde davranirsa "yerelde calisiyordu"
    # sorunu olusmuyor.
    # ==============================================================
    location /api/ {
        # ==========================================================
        # DEGISKENLI proxy_pass -- SPRINT 19'DA BULUNAN HATA
        # ==========================================================
        # Ilk halinde dogrudan "proxy_pass http://api:8080/api/"
        # yaziyordu. Kapsayici HIC BASLAMADI:
        #
        #   [emerg] host not found in upstream "api"
        #
        # Sebep: nginx upstream adlarini ACILISTA cozuyor ve
        # cozemezse baslamayi REDDEDIYOR.
        #
        # Compose icinde api genelde hazir oluyor, ama:
        #   - api kapsayicisi yeniden baslarsa frontend de coker
        #   - frontend tek basina calistirilamaz
        #
        # DEGISKEN kullanildiginda nginx cozumlemeyi ISTEK anina
        # erteliyor. API o an yoksa 502 donuyor -- yani kullanici
        # anlamli bir hata goruyor, arayuz acilmayi surdurüyor.
        #
        # resolver 127.0.0.11: Docker'in ic DNS sunucusu.
        # valid=10s: adres degisirse 10 saniyede yakalaniyor.
        #
        # $request_uri tam yolu (sorgu dizesiyle) tasiyor; degiskenli
        # proxy_pass otomatik yol degistirme YAPMIYOR, bu yuzden
        # yolu acikca vermek gerekiyor.
        # ==========================================================
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;

        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # X-Forwarded-For SART: API'nin hiz siniri (Sprint 15) gercek
        # istemci IP'sini buradan okuyor. Gondermeseydik tum istekler
        # nginx'in IP'sinden gelmis gorunur ve tek bir kullanici
        # herkesin kotasini tuketirdi.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==============================================================
    # SIGNALR -- WebSocket yukseltmesi
    # ==============================================================
    # Upgrade ve Connection basliklari OLMADAN el sikisma basarili
    # olur ama yukseltme sessizce basarisiz olur: SignalR daha yavas
    # olan "long polling" moduna duser veya hic baglanamaz.
    #
    # Sprint 10'da Vite proxy'sinde "ws: true" satirini unutup tam
    # olarak bunu yasamistim.
    # ==============================================================
    location /hubs/ {
        # Ayni gerekce (yukarida): degiskenli proxy_pass ile
        # cozumleme istek anina erteleniyor.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $hub_upstream http://api:8080;

        proxy_pass $hub_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket baglantilari uzun sureli; varsayilan 60 sn
        # zaman asimi baglantiyi surekli koparirdi.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==============================================================
    # STATIK VARLIK ONBELLEGI
    # ==============================================================
    # Vite dosya adlarina icerik ozeti (hash) koyuyor:
    # index-a3f9c2.js gibi. Icerik degisirse AD da degisiyor.
    #
    # Bu yuzden uzun onbellek guvenli: eski dosya adi bir daha
    # istenmiyor. "immutable" tarayiciya "bunu tekrar sorma" diyor.
    # ==============================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ASLA onbelleklenmiyor.
    #
    # Onbelleklenseydi kullanici yeni surumu alamazdi: elindeki eski
    # index.html, artik var olmayan dosya adlarini isterdi ve
    # uygulama bos ekranla acilirdi.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;

        # ==========================================================
        # GUVENLIK BASLIKLARI BURADA TEKRARLANIYOR -- ZORUNLU
        # ==========================================================
        # nginx'te add_header MIRAS ALINIYOR, AMA yalnizca alt
        # seviyede HIC add_header yoksa. Bir location kendi
        # add_header'ini tanimladigi anda ust seviyedekilerin
        # TAMAMINI atiyor.
        #
        # Bunu test ederek buldum: ana sayfaya bakinca yalnizca
        # Cache-Control gorunuyordu, X-Frame-Options yoktu.
        # Sebep bu blogun kendi Cache-Control'unu tanimlamasiydi --
        # ve "/" istegi try_files ile buraya dusuyor.
        #
        # Yani guvenlik basliklari, tam da EN COK gerektikleri
        # yerde (kullanicinin gordugu HTML sayfasi) eksikti.
        # ==========================================================
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Guvenlik basliklari (varsayilan) ----
    #
    # API kendi basliklarini donuyor (Sprint 15); bunlar STATIK
    # dosyalar icin.
    #
    # DIKKAT: kendi add_header'i olan her location bunlari
    # tekrarlamak zorunda (yukaridaki nota bakin).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
